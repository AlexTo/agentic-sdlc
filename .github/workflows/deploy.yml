name: Deploy

# Ships the app to a stage: by hand with workflow_dispatch, or by itself
# whenever CI passes on main, if the repository variable AUTO_DEPLOY_STAGE
# names a stage. In a fresh fork nothing is set, so this never runs by itself.
#
# A skeleton: the notes app has no cloud infrastructure yet. To use it, add a
# CDK app at packages/infra (`pnpm nx g @aws/nx-plugin:ts#infra --name=infra`)
# with stages named in its src/main.ts, then, per stage, create:
# - a GitHub environment of the same name (add required reviewers to the
#   production one), with the variables AWS_REGION, AWS_DEPLOY_ROLE_ARN (a
#   role GitHub's OIDC provider may assume, trusted only for
#   repo:<owner>/<repo>:environment:<stage>) and AWS_EXECUTION_ROLE_ARN (the
#   role CloudFormation deploys with, passed to `cdk deploy --role-arn`);
# - the CDK bootstrap in the stage's account and region.
# Discava's scripts/setup-stage.sh does all of that for its stages
# (https://github.com/AlexTo/discava/blob/main/scripts/setup-stage.sh).
#
# Post-merge Verify runs after each successful deploy.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      stage:
        description: Stage to deploy (a stage name from packages/infra/src/main.ts)
        type: string
        required: true
        default: notes-development

permissions:
  contents: read
  id-token: write

env:
  CI: "true"
  NX_DAEMON: "false"

jobs:
  deploy:
    name: Deploy (${{ inputs.stage || vars.AUTO_DEPLOY_STAGE }})
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && vars.AUTO_DEPLOY_STAGE != '') }}
    environment: ${{ inputs.stage || vars.AUTO_DEPLOY_STAGE }}
    concurrency:
      group: deploy-${{ inputs.stage || vars.AUTO_DEPLOY_STAGE }}
      cancel-in-progress: false
    env:
      STAGE: ${{ inputs.stage || vars.AUTO_DEPLOY_STAGE }}
      AWS_EXECUTION_ROLE_ARN: ${{ vars.AWS_EXECUTION_ROLE_ARN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run runs on main's latest commit; deploy the commit CI
          # actually verified instead.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Synth and deploy skip checkov and `nx affected`, so neither uv nor
      # NX_BASE/NX_HEAD is needed.
      - uses: ./.github/actions/init-monorepo
        with:
          # `pnpm trivy` pulls the Trivy image from ECR Public.
          aws-docker-login-role-arn: ${{ vars.AWS_DOCKER_LOGIN_ROLE_ARN }}
          setup-uv: "false"
          set-nx-shas: "false"

      # Fail before touching AWS, with a message that says what is missing.
      - name: Check there is something to deploy
        run: |
          if ! pnpm nx show project @agentic-sdlc/infra >/dev/null 2>&1; then
            echo "::error::No @agentic-sdlc/infra project. Add a CDK app at packages/infra first (see the comment at the top of deploy.yml)."
            exit 1
          fi
          if [[ -z "${{ vars.AWS_DEPLOY_ROLE_ARN }}" || -z "$AWS_EXECUTION_ROLE_ARN" || -z "${{ vars.AWS_REGION }}" ]]; then
            echo "::error::The \"$STAGE\" environment needs the variables AWS_REGION, AWS_DEPLOY_ROLE_ARN and AWS_EXECUTION_ROLE_ARN."
            exit 1
          fi

      # Don't release with a known CRITICAL vulnerability (that has a fix) in
      # the dependency tree, or with a committed HIGH/CRITICAL secret. Accepted
      # findings go in .trivyignore.
      - name: Scan for vulnerabilities and secrets
        run: pnpm trivy

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Synth must run after credentials are configured: stacks take their
      # account from CDK_DEFAULT_ACCOUNT, which the CDK CLI resolves from the
      # active credentials. Nx's cache key doesn't cover that, so skip it to
      # avoid reusing an assembly synthesized without an account.
      - name: Synthesize
        run: pnpm nx run @agentic-sdlc/infra:synth --skip-nx-cache

      # A rerun of CI for an older commit (or a run that waited behind a newer
      # deploy) would otherwise redeploy stale code. Checked here, inside the
      # job's concurrency slot, so it reflects main right before deploying.
      # Manual runs deploy whatever they're given, e.g. to roll back.
      - name: Check commit is still main's latest
        id: freshness
        if: ${{ github.event_name == 'workflow_run' }}
        run: |
          main_sha="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          head_sha="$(git rev-parse HEAD)"
          if [[ -n "$main_sha" && "$main_sha" == "$head_sha" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping deploy: $head_sha is no longer main's latest commit ($main_sha)."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      # --role-arn hands CloudFormation the scoped execution role.
      - name: Deploy
        if: ${{ github.event_name != 'workflow_run' || steps.freshness.outputs.current == 'true' }}
        run: pnpm nx run @agentic-sdlc/infra:deploy-ci "$STAGE/*" --role-arn "$AWS_EXECUTION_ROLE_ARN"
